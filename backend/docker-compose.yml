services:
  postgres:
    image: postgres:15
    container_name: wudox_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wudox_crm
    ports:
      - "5433:5432"
    volumes:
      - wudox_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wudox_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wudox_crm_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wudox_crm_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@wudox.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5051:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  wudox_postgres_data:
